# Sert l'application Angular et relaie /api vers l'API agent (même origine : pas de CORS).
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://agent:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    # Server-Sent Events : pas de mise en tampon, la réponse doit arriver token par token
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|woff2?|png|svg|ico)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
