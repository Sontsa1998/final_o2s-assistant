<header class="topbar">
  <button
    type="button"
    class="icon-btn on-dark drawer-toggle left"
    aria-label="Historique"
    title="Historique"
    (click)="historyOpen.set(!historyOpen()); tocOpen.set(false)"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
  </button>

  <div class="brand">
    <span class="logo" aria-label="Harvest">harvest</span>
    <span class="divider" aria-hidden="true"></span>
    <span class="product">Assistant <strong>O2S</strong></span>
  </div>

  <button
    type="button"
    class="icon-btn on-dark drawer-toggle right"
    aria-label="Sommaire"
    title="Sommaire"
    (click)="tocOpen.set(!tocOpen()); historyOpen.set(false)"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M4 12h16M4 18h12" /></svg>
  </button>
</header>

<div class="layout">
  <app-history-sidebar
    class="side left"
    [class.open]="historyOpen()"
    (navigated)="closeDrawers()"
  />
  <app-chat-panel class="main" />
  <app-toc-sidebar class="side right" [class.open]="tocOpen()" (navigated)="closeDrawers()" />

  @if (historyOpen() || tocOpen()) {
    <div class="backdrop" (click)="closeDrawers()" aria-hidden="true"></div>
  }
</div>
