- description: T097 · Comment puis-je insérer automatiquement le nom et le prénom d'un contact dans une lettr…
  vars:
    query: Comment puis-je insérer automatiquement le nom et le prénom d'un contact dans une lettre type générée
      depuis O2S ?
    reference: |-
      Pour insérer automatiquement le nom et le prénom d'un contact dans une lettre type générée depuis O2S, procédez ainsi :

      1. Rendez-vous dans le module **Contacts**.
      2. Faites un clic droit sur le contact concerné et choisissez **Imprimer un courrier** (Word ou PDF).
      3. Sélectionnez la lettre type souhaitée.
      4. Modifiez la lettre si nécessaire en ajoutant les variables correspondantes pour le nom et le prénom.
         - Utilisez la liste déroulante « Variables O2S » pour insérer facilement les variables dans le document.
         - Les variables seront remplacées automatiquement par les informations du contact lors de la génération du document.

      Ainsi, chaque lettre générée sera personnalisée avec le nom et le prénom du destinataire.

      **Source** : *https://o2s-help.harvest.fr/utiliser-les-variables-o2s-dans-vos-mails-et-lettres/
