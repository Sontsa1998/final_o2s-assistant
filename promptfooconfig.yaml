- description: T100 · Comment puis-je faire signer électroniquement plusieurs documents à un même contact dan…
  vars:
    query: Comment puis-je faire signer électroniquement plusieurs documents à un même contact dans O2S ?
    reference: |-
      Pour faire signer électroniquement plusieurs documents à un même contact dans O2S, suivez ces étapes :

      1. Accédez à la rubrique **Contacts** depuis la page d'accueil d'O2S.
      2. Sélectionnez le client concerné dans la liste.
      3. Cliquez sur le menu **Actions** puis sur **Signer électroniquement**.
      4. Dans la fenêtre **Données pour la signature** qui s'ouvre, sélectionnez le ou les documents à faire signer en cliquant sur les icônes **Document** et le **menu burger**.
      5. Ajoutez tous les documents souhaités à la liste des documents à signer.
      6. Vérifiez que les coordonnées (adresse mail et numéro de mobile) du signataire sont correctes et qu'une pièce d'identité valide est renseignée dans la fiche contact.
      7. Finalisez la demande de signature.

      Ainsi, vous pouvez faire signer plusieurs documents en une seule opération à un même contact.

      **Source** : *Utiliser la signature électronique* ([Lien](https://o2s-help.harvest.fr/utiliser-la-signature-electronique/))
