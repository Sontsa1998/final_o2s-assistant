- description: T117 · Que faut-il faire pour que le portefeuille modèle Quantalys soit utilisable dans les pr…
  vars:
    query: Que faut-il faire pour que le portefeuille modèle Quantalys soit utilisable dans les projets O2S ?
    reference: |-
      Pour que le portefeuille modèle Quantalys soit utilisable dans les projets O2S, il est indispensable de compléter les informations concernant son éligibilité. Après avoir importé le portefeuille modèle dans O2S, cliquez sur l'onglet **"Éligibilité aux projets"** et définissez les critères permettant au portefeuille d'être utilisé dans les projets. Si les critères d'éligibilité sont respectés lors de la création d'un projet, le portefeuille modèle Quantalys sera alors proposé.

