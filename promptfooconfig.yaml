- description: T091 · Quels sont les champs obligatoires à renseigner dans le fichier d'import pour ajouter u…
  vars:
    query: Quels sont les champs obligatoires à renseigner dans le fichier d'import pour ajouter un nouveau support
      à un produit existant ?
    reference: |-
      Pour ajouter un nouveau support à un produit existant via le fichier d'import dans O2S, les champs obligatoires à renseigner dans l'onglet « supports » sont :

      - **Identifiant ou nom du dépositaire** (il est recommandé d'utiliser l'identifiant, qui est un code unique et stable dans le temps)
      - **Identifiant ou nom du produit** (il est recommandé d'utiliser l'identifiant du produit)
      - **Identifiant ou nom du support** (il est recommandé d'utiliser l'identifiant du support, comme le code ISIN ou le code interne)

      **Attention :**
      - Si vous utilisez les noms (libellés), vous devez respecter strictement l'orthographe proposée dans O2S.
      - Si vous renseignez à la fois l'identifiant et le nom, assurez-vous qu'ils correspondent exactement, sinon l'import échouera.
      - Si le dépositaire, le produit ou le support n'existe pas dans O2S, contactez l'Assistance Clientèle.

      **Source** : *https://o2s-help.harvest.fr/import-export-du-catalogue-produits
