- description: T036 · Comment puis-je ajouter un versement programmé sur un compte dans O2S ?
  vars:
    query: Comment puis-je ajouter un versement programmé sur un compte dans O2S ?
    reference: |-
      Pour ajouter un versement programmé sur un compte dans O2S, suivez ces étapes :

      1. Accédez au compte concerné depuis la fiche du contact, puis ouvrez la page Portefeuille.
      2. Cliquez sur le compte souhaité pour l'ouvrir.
      3. Dans l'onglet « Général », activez l'option « Versements programmés » en cliquant sur le bouton radio correspondant.
      4. Un nouvel onglet « Versements programmés » apparaît alors.
      5. Rendez-vous dans cet onglet, puis cliquez sur « Ajouter » pour saisir les informations du versement programmé (montant, périodicité, etc.).
      6. Enregistrez votre saisie.

      Remarque : L'onglet « Versements programmés » n'apparaît que si vous avez activé l'option dans l'onglet « Général ».

      **Source** : *Gérer un compte* ([Lien](https://o2s-help.harvest.fr/gerer-un-compte/))
