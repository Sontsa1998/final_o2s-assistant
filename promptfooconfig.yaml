- description: T024 · Comment accéder et gérer les projets archivés d'un contact dans O2S ?
  vars:
    query: Comment accéder et gérer les projets archivés d'un contact dans O2S ?
    reference: |-
      Pour accéder et gérer les projets archivés d'un contact dans O2S, procédez ainsi :

      1. Rendez-vous dans l'onglet **Conformité > Projets > Projets du contact**.
      2. Cliquez sur l'en-tête de la colonne **Statut** pour trier les projets.
      3. Les projets archivés apparaîtront alors en première position.

      Remarques importantes :
      - Un projet archivé **ne peut pas être réactivé**.
      - Vous pouvez uniquement **imprimer la déclaration d'adéquation** ou **supprimer le projet** via le bouton Action.

