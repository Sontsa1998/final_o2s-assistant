- description: T059 · comment est calculée la capacité à subir des pertes ?
  vars:
    query: comment est calculée la capacité à subir des pertes ?
    reference: 'La capacité à subir des pertes globale est calculée en fonction de la situation patrimoniale et
      financière du client (évaluée dans le questionnaire de capacité à subir des pertes). Elle est ensuite modulée
      dans le parcours projet en fonction de 2 éléments : -La part du patrimoine consacré au projet - Le risque
      de désinvestissement Plus ils sont élevés, plus la capacité à subir des pertes sera réduite. Ces éléments
      sont ensuite agrégés dans une matrice afin d’obtenir une capacité à subir des pertes, quantitative : -Aucune
      perte tolérée -Perte financière limitée (moins de 10%) -Perte financière significative (entre 10% et 25%)
      -Perte financière importante (entre 25% et 50%) -Perte financière jusqu’à concurrence des montants investis
      -Perte financière au-delà des montants investis Cette capacité à subir des pertes quantitative permet ainsi
      de moduler la recommandation d’allocation du projet et à contrôler le marché cible des instruments financiers.
      https://o2s-help.harvest.fr/faq-projets/#calcul_capsubpertes'
    liens_attendus:
    - https://o2s-help.harvest.fr/faq-projets/
    targets:
    - doc_id: aide-8818-faq-projets
      url: https://o2s-help.harvest.fr/faq-projets/
