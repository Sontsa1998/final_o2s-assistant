      - La Vigilance retenue, quant à elle, est le niveau de vigilance que vous choisissez d''appliquer effectivement au client.
      Elle peut être identique ou différente de la vigilance calculée, selon votre appréciation professionnelle ou des éléments
      complémentaires non pris en compte dans le questionnaire.

      - En résumé :

      - Vigilance calculée : résultat automatique basé sur les réponses au questionnaire.

      - Vigilance retenue : niveau final appliqué, validé ou ajusté par l''utilisateur.

      - Source : *Vigilance* (Lien)'
