- description: T073 · Comment demander l'agrégation d'un nouveau partenaire ?
  vars:
    query: Comment demander l'agrégation d'un nouveau partenaire ?
    reference: |-
      Pour demander l'agrégation d'un nouveau partenaire dans O2S, suivez ces étapes :

      1. **Vérifiez vos droits** : Vous devez disposer du droit « Gestion des dépositaires » dans le module Administration > Gestion des droits > Administration.
      2. **Accédez à la gestion de l'agrégation** : Rendez-vous dans le module Administration > Gestion de l'agrégation > Source d'agrégation.
      3. **Créez une nouvelle demande** : Cliquez sur « Nouvelle demande ».
      4. **Renseignez les informations requises** : Complétez les champs concernant le fournisseur, le code apporteur, le conseiller concerné et joignez la lettre d'autorisation.
      5. **Validez la demande**.

      Pour plus de détails, vous pouvez consulter le tutoriel dédié.

      **Source** : *Mettre en place O2S dans votre structure* ([Lien](https://o2s-help.harvest.fr/mettre-en-place-o2s-dans-votre-structure/))
