- description: T090 · Comment associer un produit à une gamme et à des supports spécifiques dans le catalogue…
  vars:
    query: Comment associer un produit à une gamme et à des supports spécifiques dans le catalogue produits ?
    reference: |-
      Pour associer un produit à une gamme et à des supports spécifiques dans le catalogue produits O2S, suivez ces étapes :

      1. **Accédez à la gestion du catalogue produits**
         Rendez-vous dans :
         **Services > Personnalisation > Catalogue produits > Association gamme – produit – support**

      2. **Ajoutez le produit**
         - Cliquez sur **Ajouter un produit**.
         - Sélectionnez le produit souhaité parmi les dépositaires.

      3. **Configurez le produit**
         - Cliquez sur le produit dans la liste.
         - Cliquez sur le bouton **Configurer un produit**.

      4. **Associez la gamme**
         - Dans la fenêtre de configuration, utilisez la liste déroulante **Gamme** pour affecter une gamme au produit.

      5. **Ajoutez les supports**
         - Ajoutez les différents supports (fonds) que vous souhaitez intégrer au produit.

      6. **Enregistrez vos modifications**
         - Validez pour enregistrer l'association.

      **Remarque :**
      Vous pouvez également utiliser la fonction d'import pour gagner du temps si vous avez plusieurs produits/supports à associer.

      **Source** : *Catalogue produits* ([Lien](https://o2s-help.harvest.fr/catalogue-produits/))
