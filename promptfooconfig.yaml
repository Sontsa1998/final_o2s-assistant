- description: T081 · Comment puis-je intégrer un modèle de courrier ou d'email type dans O2S pour l'envoyer …
  vars:
    query: Comment puis-je intégrer un modèle de courrier ou d'email type dans O2S pour l'envoyer à mes clients
      ?
    reference: |-
      Pour intégrer un modèle de courrier ou d'email type dans O2S et l'envoyer à vos clients, suivez ces étapes :

      1. **Accédez à la fonctionnalité d'envoi d'emails** :
         - Cliquez sur l'icône [enveloppe] en haut d'O2S pour ouvrir la fenêtre « Emails et messages MoneyPitch ».
         - Dans l'onglet « Emails envoyés », cliquez sur « Envoyer un email ».

      2. **Sélectionnez les destinataires** :
         - Cliquez sur « A / Cc / Cci » pour choisir un ou plusieurs destinataires, puis cliquez sur « Ajouter » et « OK ».

      3. **Insérez un modèle d'email type** :
         - Dans la fenêtre de rédaction, cliquez sur le bouton « Insérer un email type » pour choisir parmi vos modèles préenregistrés.

      4. **Personnalisez et envoyez** :
         - Saisissez l'objet et, si besoin, modifiez le contenu du message.
         - Vous pouvez insérer des variables O2S pour personnaliser automatiquement chaque email.
         - Ajoutez des pièces jointes ou des images si nécessaire.
         - Cliquez sur « Envoyer » pour transmettre le message à vos clients.

      Pour les courriers Word ou autres modèles, consultez la section dédiée aux modèles de courrier et emailing pour voir comment les intégrer et les utiliser dans O2S.

      **Source** : https://o2s-help.harvest.fr/utiliser-les-variables-o2s-dans-vos-mails-et-lettres/#insertion  https://o2s-help.harvest.fr/modeles-de-courrier-et-emailing/
