- description: T014 · Comment mettre à jour le mot de passe d'un extranet ?
  vars:
    query: Comment mettre à jour le mot de passe d'un extranet ?
    reference: |-
      Pour mettre à jour le mot de passe dun extranet, vous devez vous connecter à lextranet Cardif, puis suivre les étapes suivantes :
      1. Sélectionnez un produit et saisissez un libellé identifiant celui-ci.
      2. Cliquez sur Poursuivre sur l’extranet Cardif.
      3. Sur la page de connexion à l’extranet Cardif, cliquez sur Utiliser un autre fournisseur.
      4. Choisissez HARVEST O2S – RECETTE.
      5. Sélectionnez Se connecter avec un compte existant et saisissez votre identifiant et votre mot de passe Finagora.
      6. Cliquez sur Se connecter pour mettre à jour le mot de passe de lextranet<sup>{{https://o2s-help.harvest.fr/cardif/}}</sup>.
