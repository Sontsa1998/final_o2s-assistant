- description: T062 · Comment retrouver les clients qui ont des documents en cours de signature électronique?
  vars:
    query: Comment retrouver les clients qui ont des documents en cours de signature électronique?
    reference: 'Pour retrouver vos documents qui sont en cours de signatures, il convient d’abord de cocher l’option
      « Signature » dans Services > Modules > Accueil et Pilotage > Organisation. Vous pourrez ensuite définir dans
      Services > Modules > Accueil et Pilotage > Alertes > Notifications signatures électronique, les statuts des
      signatures à suivre ainsi que le délai d’affichage de ces documents. Pour connaitre l’état d’avancement de
      la signature au niveau de tous vos clients, consultez l’encart Signature électronique dans votre page d’accueil
      O2S. Cliquez sur le chevron sur la ligne Signatures en cours : tous les clients concernés par des signatures
      en cours sont listés ici. Pour connaitre l’état d’avancement des signatures d’un client en particulier, à
      l’instar de la fenêtre sur les données de la signature, vous pouvez y accéder en cliquant sur l’icône "3 points"
      située à droite des contacts de votre module Contacts ou, depuis la fiche contact du client, en cliquant sur
      le menu "burger". Le suivi regroupe l’ensemble des signatures électroniques avec le document signé accessible
      en cliquant sur, ainsi que le statut et la date de la signature et le nom du conseiller ayant émis la demande
      de signature. La colonne DP donne accès au dossier de preuve (documents signés et pièces justificatives des
      signataires), une fois que la signature possède l’état « signé ». Enfin le menu "3 points" à droite permet
      d’effectuer des actions.'
    liens_attendus:
    - https://o2s-help.harvest.fr/utiliser-la-signature-electronique/
    targets:
    - doc_id: aide-229-utiliser-la-signature-electronique
      url: https://o2s-help.harvest.fr/utiliser-la-signature-electronique/
