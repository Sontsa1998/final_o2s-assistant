- description: T075 · Comment fusionner 2 contacts ?
  vars:
    query: Comment fusionner 2 contacts ?
    reference: |-
      Pour fusionner deux contacts dans O2S, procédez comme suit :
      1. Depuis l'onglet Contacts, sélectionnez le contact source (celui qui sera supprimé).
      2. À droite, ouvrez le menu Actions.
      3. Cliquez sur Fusionner avec un autre contact.
      4. Sélectionnez le contact cible (celui qui sera conservé) à l'aide de l'icône Rechercher un contact.
      5. Cliquez sur Fusionner.
      Remarques importantes :

      La fusion nécessite un droit spécifique. Si vous ne voyez pas l'option, contactez votre administrateur.
      Les données du contact source ne remplacent pas celles du contact cible, elles ne font que les compléter.
      Source : FAQ – Contacts (Lien)
