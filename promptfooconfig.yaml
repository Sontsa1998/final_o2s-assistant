  vars:
    question: Pourquoi je ne peux pas sélectionner un compte dans le projet ?
  assert:
  - type: llm-rubric
    value: 'La réponse doit couvrir ces points clés :

      - Vous ne pouvez pas sélectionner un compte dans un projet O2S pour plusieurs raisons principales :

      - 1. Aucun compte n''est disponible ou compatible : Seuls les comptes compatibles avec les caractéristiques du projet
      (profil d''investisseur, horizon, objectif, etc.) sont proposés. Si aucun compte n''apparaît, cela signifie qu''aucun
      compte existant ne répond aux critères d''éligibilité définis pour le projet.

      - 2. Le compte est déjà affecté à un autre projet : Un compte ne peut être affecté qu''à un seul projet à la fois. Si
      le compte est déjà utilisé dans un autre projet, il ne sera pas sélectionnable.

      - 3. Critères d''éligibilité non paramétrés : Si les critères d''éligibilité ne sont pas correctement paramétrés dans
      le catalogue produit ou sur les portefeuilles modèles, O2S ne peut pas proposer le compte pour le projet.

      - 4. Droits utilisateurs restreints : Il se peut que votre profil utilisateur ne dispose pas des droits nécessaires
      pour sélectionner ou modifier les comptes dans les projets. Vérifiez vos droits dans le menu de gestion des droits.

      - Pour résoudre ce problème :'
