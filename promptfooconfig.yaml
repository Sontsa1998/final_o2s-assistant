- description: T077 · Comment paramétrer l'envoi automatique des état de compte
  vars:
    query: Comment paramétrer l'envoi automatique des état de compte
    reference: |-
      Pour paramétrer l'envoi automatique des états de compte dans O2S, suivez ces étapes :
      1. Depuis la page d'accueil d'O2S, allez dans l'encart Alertes commerciales.
      2. Cliquez sur la clé (Gestion des alertes).
      3. Dans la liste déroulante Filtrer le type d'alerte, sélectionnez Mise en place des états de comptes.
      4. Cliquez sur Ajouter pour créer une nouvelle alerte.
      5. Cliquez sur Suivant.
      6. Définissez le type d'alerte : soit pour tous les clients, soit pour un ou plusieurs clients spécifiques (dans ce cas, cliquez sur Choisir pour sélectionner les clients concernés).
      7. Cliquez sur Suivant.
      8. Configurez l'envoi : précisez la date, la fréquence et le type d'état de comptes à envoyer.
      9. Cliquez sur Suivant.
      10. Donnez un titre à votre alerte (exemple : « Mon alerte Etats de comptes automatiques »).
      11. Réglez les paramètres de génération de l'envoi.
      12. Cliquez sur Suivant puis sur OK pour valider.

      L'envoi automatique des états de compte sera alors mis en place selon vos spécifications.

      Source : FAQ – Portefeuille et comptes (Lien)
    liens_attendus:
    - https://o2s-help.harvest.fr/faq-outils/
    targets:
