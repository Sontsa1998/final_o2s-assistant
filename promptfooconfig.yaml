- description: T094 · Comment personnaliser l'affichage des modules Accueil et Pilotage selon mes besoins dan…
  vars:
    query: Comment personnaliser l'affichage des modules Accueil et Pilotage selon mes besoins dans O2S ?
    reference: |-
      Pour personnaliser l'affichage des modules Accueil et Pilotage dans O2S selon vos besoins, procédez ainsi :

      1. Rendez-vous dans le menu : **Services > Accueil et pilotage > Organisation**.
      2. Cochez les encarts que vous souhaitez faire figurer dans l'un ou l'autre des deux modules (Accueil ou Pilotage).
      3. Validez votre sélection en cliquant sur **Enregistrer**.

      Vous pouvez également :
      - Réduire le contenu de chaque encart en cliquant sur le bouton chevron vers le bas (et le développer avec le chevron vers la droite).
      - Déplacer les encarts à l'emplacement de votre choix en cliquant sur leur nom et en les faisant glisser dans la page.

      **Remarque :** Les encarts Planning, Vigilance, Conformité et Projet ne peuvent pas être déplacés.

      **Source** : *Présentation d'O2S* ([Lien](https://o2s-help.harvest.fr/presentation/))
