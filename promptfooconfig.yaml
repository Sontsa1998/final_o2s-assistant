- description: T076 · Comment insérer mes documents réglementaires dans o2s ?
  vars:
    query: Comment insérer mes documents réglementaires dans o2s ?
    reference: |-
      Pour insérer vos documents réglementaires (lettre de mission, document d'entrée en relation, etc.) dans O2S afin de les utiliser avec vos clients, procédez ainsi :

      1. **Accédez à la bibliothèque de modèles** :
         - Rendez-vous dans le menu **Services**.
         - Cliquez sur l'onglet **Personnalisation** puis sur **Modèles Word**.

      2. **Ajoutez vos modèles** :
         - Cliquez sur **Ajouter un modèle**.
         - Sélectionnez le fichier Word de votre document réglementaire sur votre poste de travail.
         - Donnez un nom explicite à votre modèle pour le retrouver facilement.

      3. **Utilisation avec vos clients** :
         - Lors de la génération de documents pour vos clients, vous pourrez sélectionner ces modèles personnalisés depuis la bibliothèque.

      **Remarque** : Vous devez disposer des droits nécessaires pour ajouter ou modifier des modèles. Si besoin, contactez votre administrateur.

      **Source** : *FAQ – Personnaliser O2S* ([Lien](https://o2s-help.harvest.fr/faq-personnaliser-o2s/))
