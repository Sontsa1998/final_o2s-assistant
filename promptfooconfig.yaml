- description: T095 · Comment puis-je ajouter un nouveau partenaire à agréger dans O2S en utilisant une lettr…
  vars:
    query: Comment puis-je ajouter un nouveau partenaire à agréger dans O2S en utilisant une lettre d'autorisation
      ?
    reference: |-
      Pour ajouter un nouveau partenaire à agréger dans O2S en utilisant une lettre d'autorisation, suivez ces étapes :

      1. **Vérifiez vos droits** : Assurez-vous de disposer du droit « Gestion des dépositaires » dans le module Administration > Gestion des droits > Administration.
      2. **Accédez à l'agrégation** : Rendez-vous dans le module Administration > Gestion de l'agrégation > Source d'agrégation.
      3. **Nouvelle demande** : Cliquez sur le bouton « Nouvelle demande ».
      4. **Renseignez les informations** : Remplissez les champs demandés concernant le fournisseur, le code apporteur, le conseiller concerné et joignez la lettre d'autorisation.
      5. **Validez** : Finalisez la demande pour que le partenaire soit pris en compte.

