- description: Que dois-je faire si des mouvements restent en attente sur un compt...
  vars:
    question: Que dois-je faire si des mouvements restent en attente sur un compte agrégé dans O2S ?
  assert:
  - type: llm-rubric
    value: 'La réponse doit couvrir ces points clés :

      - Si des mouvements restent en attente sur un compte agrégé dans O2S, voici les étapes à suivre :

      - 1. Vérification de la validation par le dépositaire : Les mouvements restent en attente tant que le dépositaire ne
      les a pas validés. Une fois la validation effectuée, vous recevez une alerte dans le module Accueil d''O2S.

      - 2. Traitement de l''alerte : Après réception de l''alerte (nouveaux comptes ou mouvements en attente), vous devez
      rapprocher le mouvement en attente avec le mouvement importé. Cela permet de lier le mouvement en attente à celui validé
      par le dépositaire.

      - 3. Modification du statut : Pour les mouvements non agrégés, après réception de la notification (par exemple, une
      lettre envoyée au client), il est nécessaire de modifier manuellement le statut du mouvement en attente afin qu''il
      devienne actif.

      - 4. Fusion ou liaison : Sélectionnez le mouvement en attente dans O2S pour le lier avec le mouvement importé correspondant.

      - En résumé, il faut surveiller les alertes, rapprocher ou lier les mouvements en attente avec ceux validés/importés,
      puis modifier leur statut pour qu''ils deviennent actifs dans O2S.'
