- description: T080 · Réactiver un compte ?
  vars:
    query: Réactiver un compte ?
    reference: |-
      Pour réactiver un compte dans O2S, suivez ces étapes :

      1. Cliquez sur votre nom (menu utilisateur).
      2. Allez dans **Services > Modules > Contacts > Contacts et comptes supprimés > Comptes désactivés**.
      3. Cochez le compte que vous souhaitez réactiver.
      4. Cliquez sur **Réactiver**.

      Remarque : Un compte ne peut pas être archivé, il peut uniquement être désactivé ou supprimé.

      **Source** : *FAQ – Portefeuille et comptes* ([Lien](https://o2s-help.harvest.fr/faq-portefeuille-et-comptes/))
