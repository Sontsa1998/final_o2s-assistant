- description: T018 · Comment puis-je afficher et filtrer toutes les activités liées à un contact dans O2S ?
  vars:
    query: Comment puis-je afficher et filtrer toutes les activités liées à un contact dans O2S ?
    reference: |-
      Pour afficher et filtrer toutes les activités liées à un contact dans O2S :

      1. Depuis la liste de vos contacts, cliquez sur l'icône située à droite de la ligne du contact concerné.
      2. Sélectionnez « Afficher les activités ».
      3. La liste des activités du contact s'affiche.
      4. Utilisez la liste déroulante « Afficher » pour filtrer les activités (par exemple : tâches, rendez-vous, suivis, etc.).

      Vous pouvez ensuite gérer chaque activité en cliquant sur l'icône crayon pour modifier ou sur la croix pour supprimer.

      **Source** : *Tous les rendez-vous, tâches et suivis d'un contact en 2 clics* ([Lien](https://o2s-help.harvest.fr/tous-les-rendez-vous-taches-et-suivis-dun-contact-en-2-clics/))
