# ============================================================
# promptfoo config — Évaluation de l'agent RAG Kiss My Agent V3
# ============================================================
# Généré depuis questions_tests.csv (125 questions)
# Usage :
#   npx promptfoo eval              (évaluation complète)
#   npx promptfoo eval --no-cache   (forcer une nouvelle évaluation)
#   npx promptfoo view              (interface web des résultats)
# ============================================================

description: Évaluation de l'Assistant O2S — 125 questions (questions_tests.csv)
providers:
- id: http
  config:
    url: http://127.0.0.1:8000/chat
    method: POST
    headers:
      Content-Type: application/json
    body:
      question: '{{question}}'
    responseParser: "json.answer || json.detail || ''"
prompts:
- '{{question}}'
