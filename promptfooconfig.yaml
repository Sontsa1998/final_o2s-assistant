- description: T078 · Configurer l'agenda O2S dans mon iphone
  vars:
    query: Configurer l'agenda O2S dans mon iphone
    reference: |-
      Pour configurer l'agenda O2S sur votre iPhone, vous devez utiliser le protocole CalDAV. Voici les étapes générales à suivre :

      1. Rendez-vous dans les **Réglages** de votre iPhone.
      2. Sélectionnez **Mots de passe et comptes** (ou **Mail, Contacts, Calendrier** selon la version iOS).
      3. Appuyez sur **Ajouter un compte** puis choisissez **Autre**.
      4. Sélectionnez **Ajouter un compte CalDAV**.
      5. Renseignez les informations du serveur CalDAV fournies par O2S (adresse du serveur, identifiant, mot de passe).
      6. Enregistrez le compte.

      Votre agenda O2S sera alors synchronisé avec l'application Calendrier de votre iPhone.
      **Remarque :** La synchronisation n'est pas instantanée. Les données sont récupérées automatiquement toutes les 15 minutes. Pour voir les modifications immédiatement, actualisez manuellement l'agenda dans O2S.
    liens_attendus:
