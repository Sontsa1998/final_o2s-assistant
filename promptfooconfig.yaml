- description: T058 · comment être notifié de l'anniversaire de mon client ?
  vars:
    query: comment être notifié de l'anniversaire de mon client ?
    reference: 'Dans votre page d’accueil d’O2S, rendez-vous dans l’encart Alertes commerciales. Cliquez sur la
      clé (Gestion des alertes). Ajouter une alerte : Cliquez sur « Ajouter » pour créer une nouvelle alerte. Cliquez
      sur le bouton-radio Alerte sur l''anniversaire du client. Cliquez sur Suivant. Donnez un titre à votre alerte,
      par exemple « Mon alerte Etats de comptes automatiques ». Réglez les paramètres de l''anniversaire. Cliquez
      sur Suivant. Cliquez sur OK pour valider votre alerte. Si vous souhaitez déclencher immédiatement votre alerte,
      sélectionnez votre alerte dans la liste, puis cliquez sur Générer.'
