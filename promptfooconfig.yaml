- description: Pourquoi la performance cumulée peut-elle être différente du gain b...
  vars:
    question: Pourquoi la performance cumulée peut-elle être différente du gain brut en pourcentage après plusieurs mouvements
      sur un compte ?
  assert:
  - type: llm-rubric
    value: 'La réponse doit couvrir ces points clés :

      - La performance cumulée peut être différente du gain brut en pourcentage après plusieurs mouvements (versements, rachats,
      arbitrages) sur un compte car ces deux indicateurs ne mesurent pas la même chose :

      - Le gain brut en pourcentage mesure le rendement des capitaux placés sur le compte, en comparant la situation finale
      à la somme des montants investis (situation initiale + versements complémentaires). Il prend donc en compte tous les
      flux entrants et sortants.

      - La performance cumulée mesure le rendement des supports sélectionnés au cours du temps, en neutralisant l''effet des
      mouvements (entrées/sorties). Elle met en avant la qualité des choix d''allocation, indépendamment du timing des investissements.

      - Ainsi, dès qu''il y a des mouvements (versements, rachats, arbitrages), la performance cumulée et le gain brut en
