- description: T092 · Comment puis-je exporter le paramétrage actuel des commissions dans O2S pour le modifier ?
  vars:
    query: Comment puis-je exporter le paramétrage actuel des commissions dans O2S pour le modifier ?
    reference: |-
      Pour exporter le paramétrage actuel des commissions dans O2S afin de le modifier, suivez ces étapes :

      1. Rendez-vous dans le menu **Services > Personnalisation > Catalogue produits > Commissions perçues**.
      2. Cliquez sur le lien **Exporter le paramétrage des commissions**.
      3. Un fichier Excel sera généré. Ce fichier contiendra l'ensemble des produits et supports présents dans votre catalogue produits, avec leur paramétrage de commissionnement.

      **Remarques importantes :**
      - Il n'existe pas de fichier modèle vierge pour cette opération. Vous devez impérativement passer par l'export de votre paramétrage actuel.
      - Le fichier exporté respecte le formalisme nécessaire à l'import. Après modification, il pourra être réimporté dans O2S.
      - Lors de l'enregistrement du fichier, veillez à le sauvegarder au format **Classeur Excel 97-2003 (*.xls)**, **Classeur Excel (*.xlsx)** ou **Données XML (*.xml)**.

      **Source** : *Import / export du paramétrage des frais et commissions* ([Lien](https://o2s-help.harvest.fr/import-export-du-parametrage-des-commissions/))
