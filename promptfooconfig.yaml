- description: T093 · Quels champs obligatoires dois-je renseigner lors de la création d'une demande de suppo…
  vars:
    query: Quels champs obligatoires dois-je renseigner lors de la création d'une demande de support dans le module
      Contribution ?
    reference: |-
      Lors de la création d'une demande de support dans le module Contribution d'O2S, vous devez obligatoirement renseigner les champs suivants :

      - **Gestionnaire**
      - **Type de support**
      - **Libellé** (ce champ dispose d'une loupe pour vérifier si le support existe déjà dans O2S)
      - **Devise de cotation**

      Plus votre demande sera précise, plus elle sera traitée rapidement. Il est également recommandé de renseigner d'autres champs si possible (code ISIN, date de commercialisation, valorisation, documents, etc.), mais ils ne sont pas obligatoires.

      **Source** : *Demande de création de support* ([Lien](https://o2s-help.harvest.fr/demande-de-creation-de-support/))
