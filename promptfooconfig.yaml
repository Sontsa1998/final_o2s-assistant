- description: T086 · Les tâches créées dans O2S sont-elles synchronisées avec le calendrier de mon iPhone ou…
  vars:
    query: Les tâches créées dans O2S sont-elles synchronisées avec le calendrier de mon iPhone ou iPad ?
    reference: |-
      Oui, les tâches créées dans O2S peuvent être synchronisées avec le calendrier de votre iPhone ou iPad grâce à l'intégration du protocole CalDAV. Cela permet de partager et synchroniser les événements et tâches de l'agenda O2S avec votre appareil iOS. Cependant, veuillez noter que la synchronisation n'est pas instantanée : la récupération des données se fait automatiquement toutes les 15 minutes. Pour voir immédiatement les modifications, il est nécessaire d'actualiser manuellement l'agenda O2S sur votre appareil.

      **Source** : *Synchroniser vos agendas avec O2S – Présentation* ([Lien](https://o2s-help.harvest.fr/synchroniser-mes-agendas-avec-o2s/))
