- description: T055 · Quelles sont les conséquences de l'action 'Supprimer le compte' sur le portefeuille du …
  vars:
    query: Quelles sont les conséquences de l'action 'Supprimer le compte' sur le portefeuille du client dans O2S
      ?
    reference: |-
      Lorsque vous sélectionnez l'action « Supprimer le compte » dans O2S, le compte concerné est définitivement retiré du portefeuille du client. Cela signifie qu'il n'apparaîtra plus dans la liste des comptes du client, ni dans les états de compte, les historiques ou les analyses du portefeuille. Cette action est à privilégier si le compte n'a plus d'intérêt à être conservé dans O2S.

      **Attention :** La suppression est définitive et le compte ne pourra plus être consulté ou restauré par la suite.

      **Source** : *Alerte sur les situations de comptes à zéro* ([Lien](https://o2s-help.harvest.fr/alerte-sur-les-situations-de-comptes-a-zero/))
    liens_attendus:
    - https://o2s-help.harvest.fr/alerte-sur-les-situations-de-comptes-a-zero/
