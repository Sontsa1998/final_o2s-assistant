- description: T098 · Comment puis-je créer et personnaliser un modèle de lettre type à envoyer à mes clients…
  vars:
    query: Comment puis-je créer et personnaliser un modèle de lettre type à envoyer à mes clients dans O2S ?
    reference: |-
      Pour créer et personnaliser un modèle de lettre type dans O2S, suivez ces étapes :

      1. **Accédez à la gestion des lettres types**
         Rendez-vous dans le menu :
         `Services > Personnalisation > Lettres types`.

      2. **Ajoutez un nouveau modèle**
         Dans la liste des lettres types, cliquez sur **Ajouter** pour ouvrir la fenêtre de configuration d'un nouveau courrier type.

      3. **Renseignez les informations obligatoires**
         Remplissez les champs « Titre », « Note » et « Sujet » pour identifier votre lettre.

      4. **Rédigez et personnalisez le contenu**
         Utilisez la zone de saisie du corps du texte pour rédiger votre lettre.
         Vous pouvez insérer des variables O2S (nom, prénom, adresse, etc.) via la liste déroulante « Variables O2S » pour personnaliser automatiquement chaque courrier selon le destinataire.

      5. **Validez et enregistrez**
         Cliquez sur **OK** pour enregistrer votre modèle.
         Pour qu'il soit disponible à l'envoi, assurez-vous que le champ « Validé » est sur Oui.

      Vous pouvez ensuite utiliser ce modèle lors de l'envoi de courriers à vos clients, en l'adaptant si besoin à chaque envoi.

      **Source** : https://o2s-help.harvest.fr/utiliser-les-variables-o2s-dans-vos-mails-et-lettres/
