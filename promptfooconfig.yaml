- description: T085 · Comment activer la synchronisation directe entre O2S et Google Agenda ?
  vars:
    query: Comment activer la synchronisation directe entre O2S et Google Agenda ?
    reference: |-
      Pour activer la synchronisation directe entre O2S et Google Agenda, suivez ces étapes :

      1. **Prérequis** : Assurez-vous de disposer d'une adresse email Google (ex : jean.durand@gmail.com).

      2. **Accès au paramétrage** :
         - Dans O2S, allez dans **Services > Synchronisation > Google**.

      3. **Saisie des informations** :
         - Renseignez votre adresse email Google.
         - Cliquez sur **Enregistrer**.

      4. **Autorisation Google** :
         - Si un message d'erreur apparaît concernant la sécurité, déconnectez-vous d'O2S.
         - Rendez-vous sur [https://g.co/allowaccess](https://g.co/allowaccess) et suivez les instructions.
         - Reconnectez-vous à O2S et enregistrez à nouveau vos paramètres Google.

      5. **Paramètres de synchronisation** :
         - Cochez la case pour activer la synchronisation de l'agenda.
         - Choisissez la fréquence de synchronisation et la date de début.
         - Cliquez sur **Enregistrer**.

      6. **Autorisation finale** :
         - Une fenêtre s'ouvre pour autoriser la connexion d'O2S à Google Agenda. Cliquez sur **J'accepte**.

      **Remarque** : Si vous n'êtes pas connecté à Gmail lors du paramétrage, il vous sera demandé de vous identifier.

      **Source** : *Google Agenda* ([Lien](https://o2s-help.harvest.fr/google-agenda/))
    liens_attendus:
    - https://o2s-help.harvest.fr/google-agenda/
    targets:
    - doc_id: aide-3720-google-agenda
      url: https://o2s-help.harvest.fr/google-agenda/
