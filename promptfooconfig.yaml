- description: T101 · Quelles sont les étapes à suivre pour importer un fichier Excel de comptes dans O2S ?
  vars:
    query: Quelles sont les étapes à suivre pour importer un fichier Excel de comptes dans O2S ?
    reference: |-
      Pour importer un fichier Excel de comptes dans O2S, suivez ces étapes :

      1. **Téléchargez le fichier modèle**
         Rendez-vous dans :
         *Services > Modules > Portefeuille > Import comptes (xls)*
         Téléchargez le fichier Excel modèle (o2s_modele_import_comptes.xls) et enregistrez-le sur votre ordinateur.

      2. **Renseignez le fichier d'import**
         Complétez l'onglet « comptes » du fichier sans modifier l'en-tête ni ajouter d'onglets/colonnes. Respectez le formalisme et les consignes indiquées dans le modèle.

      3. **Chargez le fichier dans O2S**
         Accédez à :
         *Services > Modules > Portefeuille > Import de comptes (xls)*
         Cliquez sur « Parcourir » pour sélectionner votre fichier Excel, puis cliquez sur « OK ».

      4. **Analysez le fichier**
         Cliquez sur le bouton « Analyser le fichier ». O2S vérifie la conformité et la compatibilité des données.

      5. **Corrigez les éventuelles erreurs**
         Si des erreurs sont détectées, cliquez sur « Afficher les rejets » pour consulter les messages d'erreur et corrigez votre fichier en conséquence. Recommencez l'import si nécessaire.

      6. **Importez les comptes**
         Si toutes les situations sont valides, cliquez sur « Importer » pour finaliser l'importation des comptes dans O2S.

      **Remarques importantes :**
      - Utilisez toujours le fichier modèle fourni par O2S.
      - Toute situation rejetée bloque l'import du fichier entier.

      **Source** : *Import de comptes (xls)* ([Lien](https://o2s-help.harvest.fr/import-de-comptes/))
    liens_attendus:
    - https://o2s-help.harvest.fr/import-de-comptes/
