- description: T087 · Comment puis-je synchroniser mon agenda O2S avec Thunderbird ?
  vars:
    query: Comment puis-je synchroniser mon agenda O2S avec Thunderbird ?
    reference: |-
      Pour synchroniser votre agenda O2S avec Thunderbird, suivez ces étapes :

      1. **Installer le module Lightning**
         - Ouvrez Thunderbird.
         - Allez dans **Outils > Modules complémentaires**.
         - Recherchez et installez le module « Lightning » si ce n'est pas déjà fait.

      2. **Ajouter l'agenda O2S**
         - Cliquez sur le menu (icône « burger »), puis sur **Nouveau > Agenda…**.
         - Sélectionnez **Sur le réseau**, puis cliquez sur **Suivant**.
         - Choisissez le format **CalDAV**.
         - Dans la zone **Emplacement**, saisissez l'adresse suivante :
           `https://www.office2s.com/office2s/caldav.php/calendars/id/o2s`
         - Saisissez votre identifiant O2S (celui utilisé pour Harvest Connect).
           **Attention :** Si vous utilisez O2S en mode SSO, contactez votre administrateur O2S.
         - Cliquez sur **Suivant**.

      3. **Configurer l'agenda**
         - Donnez un nom à votre agenda (ex. « Agenda O2S »), choisissez une couleur si besoin, et renseignez votre adresse email.
         - Cliquez sur **Suivant**.

      4. **Authentification**
         - Saisissez vos identifiants O2S dans la fenêtre d'authentification.
         - Cochez l'option pour enregistrer vos identifiants afin de rendre la synchronisation transparente à l'avenir.

      5. **Finalisation**
         - Une fois validé, l'agenda O2S apparaît dans la liste des agendas de Thunderbird.

      6. **Paramétrer la synchronisation**
         - Faites un clic droit sur l'agenda O2S, puis sélectionnez **Propriétés**.
         - Choisissez la fréquence d'actualisation souhaitée (par exemple, « Chaque minute » pour une synchronisation optimale).
         - Cliquez sur **OK**.

      **Remarques :**
      - La synchronisation fonctionne dans les deux sens (ajout, modification, suppression).
      - Pour que les événements créés dans Thunderbird soient synchronisés avec O2S, associez-les bien à l'agenda O2S lors de leur création.
      - Les tâches sont également synchronisées.

      **Source** : *Thunderbird* ([Lien](https://o2s-help.harvest.fr/thunderbird/))
