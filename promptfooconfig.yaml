- description: T088 · Comment associer un nouveau client importé à un contact O2S déjà existant ?
  vars:
    query: Comment associer un nouveau client importé à un contact O2S déjà existant ?
    reference: |-
      Pour associer un nouveau client importé à un contact O2S déjà existant, procédez ainsi :

      1. Rendez-vous dans le module **Accueil**, puis cliquez sur l'alerte « Nouveaux clients détectés » dans le bloc Alertes techniques.
      2. Dans la liste des nouveaux clients, repérez le client à associer.
      3. Dans la colonne « Actions », sélectionnez l'option **Associer le client importé au client O2S** via la liste déroulante.
      4. Cliquez sur l'icône de modification pour choisir le contact O2S existant auquel associer le client importé.
      5. Validez votre choix en cliquant sur **OK**.

      **Remarques :**
      - Si le contact O2S ne possède ni adresse, ni code postal, ni ville, ni pays, l'adresse du client importé sera transférée dans O2S. Sinon, l'adresse du contact O2S est conservée.
      - Vous pouvez également mettre à jour les coordonnées du contact ou lui affecter un conseiller avant de valider.

      **Source** : *Alerte sur les nouveaux clients* ([Lien](https://o2s-help.harvest.fr/alerte-sur-les-nouveaux-clients/)), *FAQ – Contacts* ([Lien](https://o2s-help.harvest.fr/faq-contacts/))
