    reference: |-
      Pour modifier le questionnaire du profil investisseur d'un client déjà existant dans O2S, procédez comme suit :

      1. Accédez à la fiche du client, puis à l'onglet **Conformité > Profil d'investisseur**.
      2. Sur la page du profil investisseur, à gauche, cliquez sur le lien **modifier le questionnaire d'O2S**.
      3. Les réponses précédemment fournies seront pré-cochées par défaut. Vous pouvez les modifier ou les réinitialiser à l'aide du bouton **Réinitialiser** en bas à gauche de l'écran.
      4. Suivez les étapes du questionnaire comme lors de la première saisie, puis validez.

