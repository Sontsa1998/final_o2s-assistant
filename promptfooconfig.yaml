- description: T057 · comment personnaliser le logo de mon O2S ?
  vars:
    query: comment personnaliser le logo de mon O2S ?
    reference: 'Vous devez disposer des droits nécessaires pour effectuer cette opération. Contactez votre administrateur.
      Dans Services, cliquez sur l’onglet Personnalisation puis allez dans Logos > Logo de l’application. A droite,
      cochez l’option Logo de l’application puis cliquez sur le bouton Parcourir à droite de « Nouvelle image ».
      Sélectionnez le fichier image du logo. Cliquez sur Enregistrer. Votre logo figure alors en haut à gauche de
      l’interface. La taille du logo de l’application ne doit pas excéder 175 x 50 pixels. Le poids de l’image ne
      doit pas excéder 1 Mo. Le format de fichier (extension) peut être les suivants : JPG, JPEG, GIF, J2K, JP2,
      BMP ou PNG.'
