- description: T083 · Comment créer ou modifier une liste d'expert-comptables ou de notaires dans O2S pour fa…
  vars:
    query: Comment créer ou modifier une liste d'expert-comptables ou de notaires dans O2S pour faciliter la saisie
      de données ?
    reference: |-
      Pour créer ou modifier une liste d'expert-comptables ou de notaires dans O2S, suivez ces étapes :

      1. Rendez-vous dans le module **Services**.
      2. Cliquez sur l'onglet **Personnalisation**, puis allez dans **Paramétrage**.
      3. Cliquez sur la page **Immobilier**.
      4. Dans le panneau de droite, double-cliquez sur l'élément des paramètres dont vous souhaitez modifier la liste (par exemple, expert-comptable ou notaire).
      5. Dans la fenêtre qui s'affiche, vous pouvez :
         - Modifier ou supprimer une entrée existante,
         - Ajouter une nouvelle entrée.
      6. Une fois la saisie terminée, cliquez sur **Fermer**.

      **Remarque :** Vous devez disposer des droits nécessaires pour modifier ces listes.

      Cela vous permettra de sélectionner rapidement ces éléments via des listes déroulantes lors de la saisie, évitant ainsi les saisies répétitives.

      **Source** : *FAQ – Personnaliser O2S* ([Lien](https://o2s-help.harvest.fr/faq-personnaliser-o2s/))
