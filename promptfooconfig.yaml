- description: T108 · Quelle est la procédure pour enregistrer une requête afin qu'elle soit accessible à mes…
  vars:
    query: Quelle est la procédure pour enregistrer une requête afin qu'elle soit accessible à mes collaborateurs
      ?
    reference: |-
      Pour enregistrer une requête et la rendre accessible à vos collaborateurs dans O2S, suivez ces étapes :

      1. Depuis l'onglet où s'affiche le résultat de votre requête, cliquez sur l'icône [menu burger] en haut à droite.
      2. Sélectionnez « Enregistrer sous… ».
      3. Donnez un titre à votre requête.
      4. Choisissez l'option « Publique » pour que la requête soit accessible à vos collaborateurs.
      5. Cliquez sur OK pour valider l'enregistrement.

      La requête apparaîtra alors dans la liste des requêtes et sera accessible à tous les collaborateurs. Vous pouvez également modifier le statut d'une requête (publique/privée) en cliquant sur l'icône cadenas à côté de la requête.

