      - 1. Détermination du profil d''investisseur : Avant de créer un projet, vous devez impérativement avoir renseigné la
      classification MIF du client et déterminé son profil d''investisseur (niveau de connaissance, expérience, profil de
      risque).

      - 2. Création du projet d''investissement : Dans l''espace Projets d''O2S, vous définissez les caractéristiques du projet
      (objectif patrimonial, horizon, capacité à subir des pertes, exclusions éventuelles).

      - 3. Sélection des comptes et allocation : Vous associez des comptes existants ou recommandez de nouveaux comptes (comptes
      titres, PEA, assurance-vie, etc.) au projet, puis vous définissez une allocation d''actifs.

      - 4. Contrôle d''adéquation : O2S vérifie automatiquement si le niveau de risque de l''allocation proposée correspond
      au profil d''investisseur du client. Un indicateur global vous signale si l''adéquation est respectée ou non, en prenant
      en compte la connaissance par instruments financiers et le profil de risque.

      - 5. Alertes : O2S vous alerte si l''exposition au risque du projet dépasse les limites définies avec le client, afin
      de garantir la conformité réglementaire.'
