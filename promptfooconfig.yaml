- description: T038 · Comment puis-je créer une alerte pour l'anniversaire d'un client dans O2S ?
  vars:
    query: Comment puis-je créer une alerte pour l'anniversaire d'un client dans O2S ?
    reference: |-
      Pour créer une alerte pour l'anniversaire d'un client dans O2S, suivez ces étapes :

      1. Accédez au module **Accueil**.
      2. Cliquez sur le bouton **Gestion des alertes** dans le bloc « Alertes commerciales ».
      3. Cliquez sur **Ajouter** pour créer une nouvelle alerte.
      4. Sélectionnez l'option **Alerte sur l'anniversaire du client**.
      5. Renseignez les informations demandées (âge, date, etc.) dans les différents écrans, en cliquant sur **Suivant** pour passer d'un écran à l'autre.
      6. Après avoir vérifié les données, cliquez sur **OK** pour valider la création de l'alerte.

      L'alerte sera alors automatiquement activée et vous serez prévenu à la date et l'âge définis.

      **Source** : *Alertes client* ([Lien](https://o2s-help.harvest.fr/alertes-client/))
    liens_attendus:
