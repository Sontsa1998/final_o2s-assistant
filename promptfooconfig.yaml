- description: T074 · Comment fusionner 2 comptes ?
  vars:
    query: Comment fusionner 2 comptes ?
    reference: |-
      Pour fusionner deux comptes dans O2S, suivez ces étapes :

      1. Accédez à la page Portefeuille.
      2. Cliquez sur l'icône [menu burger] en haut à droite de la fenêtre.
      3. Sélectionnez l'option « Fusionner ».
      4. Dans la fenêtre qui s'ouvre :
         - Cliquez sur le compte à fusionner (à gauche).
         - Cliquez sur le compte à conserver (à droite).
      5. Validez en cliquant sur « Fusionner ».

