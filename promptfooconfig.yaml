- description: Comment le risque de crédit est-il pris en compte dans le calcul du...
  vars:
    question: Comment le risque de crédit est-il pris en compte dans le calcul du SRI pour un fonds multi-asset ?
  assert:
  - type: llm-rubric
    value: 'La réponse doit couvrir ces points clés :

      - Pour un fonds multi-asset, le risque de crédit (MRC) est pris en compte dans le calcul du SRI (Indicateur Synthétique
      de Risque) en complément du risque de marché (MRM). Voici comment cela fonctionne :
      - 1. Évaluation du risque de crédit :
      - Le risque de crédit est déterminé à partir des notations de crédit attribuées à l''émetteur par un ou plusieurs organismes
      externes d''évaluation du crédit (OEEC), certifiés ou enregistrés auprès de l''Autorité européenne des marchés financiers
      (AEMF). Si plusieurs notations existent, la notation médiane est retenue (ou la plus faible des deux valeurs centrales
      si le nombre est pair). Le MRC est alors attribué sur une échelle de 1 à 6.
      - 2. Combinaison avec le risque de marché :
      - Une fois le MRC (risque de crédit) et le MRM (risque de marché) déterminés, le SRI global du fonds multi-asset est
     obtenu en combinant ces deux valeurs selon un tableau de correspondance défini par la réglementation PRIIPs.
      - Pour un fonds multi-asset avec un risque de crédit (MRC) de 3 et un risque de marché (MRM) de 4, le SRI final sera
      de 4.'
