- description: T082 · Comment comparer plusieurs produits d'assurance vie et proposer différentes allocations…
  vars:
    query: Comment comparer plusieurs produits d'assurance vie et proposer différentes allocations d'actifs pour
      un même projet afin de répondre aux exigences DDA dans O2S ?
    reference: |-
      Pour répondre aux exigences DDA dans O2S, vous pouvez comparer plusieurs produits d'assurance vie et proposer différentes allocations d'actifs pour un même projet en suivant ces étapes :

      1. **Création du projet d'investissement** : Créez un projet pour votre client en précisant ses objectifs, son profil de risque et son horizon d'investissement.

      2. **Comparaison des produits** :
         - Lors de la préconisation, O2S vous permet de comparer les caractéristiques des produits d'assurance vie adaptés aux objectifs du client.
         - Vous pouvez sélectionner plusieurs produits similaires et comparer leurs caractéristiques (frais, options de gestion, etc.) directement dans le parcours projet.

      3. **Propositions d'allocations distinctes** :
         - Pour un même projet, vous pouvez réaliser plusieurs propositions de produits, chacune avec une allocation d'actifs différente.
         - Cela permet au client de choisir la combinaison produit/allocation qui lui convient le mieux.

      4. **Présentation au client** :
         - O2S génère un rapport d'adéquation intégrant la comparaison des produits et des allocations proposées.
         - Vous pouvez joindre les fiches d'information des produits à ce rapport.

      Des tutoriels vidéo détaillent ces fonctionnalités :
      - [DDA – Comparaison des caractéristiques produits](https://www.youtube.com/embed/vfxyFf8Zg18?feature=oembed)
      - [DDA – Comparaison de produits et allocations distincts](https://www.youtube.com/embed/L2MseaxHlnU?feature=oembed)

      **Source** : *Tutos – Parcours Projet* ([Lien](https://o2s-help.harvest.fr/parcours-projet/)), https://o2s-help.harvest.fr/projets/#creer_projet
    liens_attendus:
