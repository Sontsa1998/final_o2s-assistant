- description: T050 · Comment puis-je créer un nouveau rendez-vous dans le module Agenda d'O2S ?
  vars:
    query: Comment puis-je créer un nouveau rendez-vous dans le module Agenda d'O2S ?
    reference: |-
      Pour créer un nouveau rendez-vous dans le module Agenda d'O2S, suivez ces étapes :

      1. Accédez au module Agenda.
      2. Cliquez sur le bouton **+ Créer**.
      3. Renseignez obligatoirement le champ « Objet ».
      4. Sélectionnez au minimum un participant dans l'onglet **Affectation**.
      5. Choisissez la date et l'heure du rendez-vous.
      6. Saisissez éventuellement les autres informations souhaitées.
      7. Validez : l'évènement s'affichera automatiquement dans les modules Agenda et Accueil.

      Vous pouvez également créer un rendez-vous en cliquant directement sur la ligne ou la case correspondant à l'heure ou au jour de votre choix dans les modes « Jour » ou « Semaine » de l'agenda.

      **Source** : *Agenda O2S* ([Lien](https://o2s-help.harvest.fr/agenda/))
    liens_attendus:
    - https://o2s-help.harvest.fr/agenda/
    targets:
    - doc_id: aide-11-agenda-o2s
      url: https://o2s-help.harvest.fr/agenda/
