# Catalogue de la base documentaire (docs/).
#
# Les fichiers de docs/ sont générés automatiquement : 9 références/guides API (contrats OpenAPI
# .json et PDF convertis en Markdown) et 388 articles d'aide en ligne O2S/MoneyPitch scrapés depuis
# o2s-help.harvest.fr -> on n'y ajoute pas de frontmatter, qui serait perdu à la prochaine
# conversion/re-scrape. Les metadata de niveau document sont donc déclarées ici, par nom de fichier.
# Priorité : frontmatter du fichier > entrée du catalogue > `defaults`.
#
# Champs d'un document (tous propagés à plat dans le payload Qdrant de chaque chunk) :
#   doc_id         identifiant stable (citations, évaluation, filtres)
#   title          titre affiché dans les citations
#   api            famille d'API : comptes | contacts | documents | referentiels | utilisateurs |
#                  o2s_api (références techniques) ; o2s_app pour les 388 articles d'aide en ligne
#   api_name       nom officiel de l'API (titre du contrat OpenAPI)
#   version        version du contrat d'API (absente pour les guides PDF et l'aide en ligne)
#   doc_type       reference_api (contrat OpenAPI) | guide_fonctionnel (doc O2S complémentaire ou
#                  procédure d'aide en ligne) | faq | fiche_partenaire_agregation |
#                  fiche_partenaire_integration | procedure_technique | test
#   source_format  openapi | pdf | markdown  -> pilote la normalisation avant découpage
#                  (voir markdown_loader.py)
#   resources      ressources métier exposées
#   default_theme  thème des chunks quand aucune règle ne s'applique (cf. taxonomy.yaml)
#   related_docs   documents complémentaires (référence <-> guide)
#   audience       integrateur (références/guides API) | utilisateur_o2s (aide en ligne)
#   source_url     URL d'origine (articles d'aide en ligne scrapés)
#   description    résumé court, affiché dans les outils d'exploration du catalogue

defaults:
  language: fr
  audience: integrateur
  tags: [o2s, harvest]

documents:
  # ------------------------------------------------------------------ références OpenAPI
  "Harvest API - Comptes O2S.md":
    doc_id: ref-api-comptes-o2s
    title: "Harvest API - Comptes O2S (référence technique)"
    api: comptes
    api_name: "Harvest API - Comptes O2S"
    version: "0.9.3"
    doc_type: reference_api
    source_format: openapi
    resources: [Compte]
    default_theme: comptes
    related_docs: [guide-api-comptes-o2s, ref-o2s-api]
    tags: [comptes, situations, oauth2]
    description: >-
      Contrat de l'API de gestion des comptes O2S : lister / créer un compte (GET, POST /comptes),
      obtenir / mettre à jour un compte (GET, PUT /comptes/{compteId}), mettre à jour ses situations
      (PUT /comptes/{compteId}/situations), schémas Compte et OAuth, en-tête Content-Range.

  "Harvest API - Comptes.md":
