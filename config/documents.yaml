# Catalogue de la base documentaire (docs/) — 395 fichiers indexés.
#
#   - 9 documents d'API (corpus `api_technique`, `Harvest API - *.md`) : 6 contrats OpenAPI convertis + 3
#     guides PDF « Documentation API O2S » ; metadata curatées ci-dessous (entrées `documents`).
#   - 386 documents de l'aide en ligne o2s-help.harvest.fr (corpus `aide_en_ligne`, `docs/aide_en_ligne/`),
#     GÉNÉRÉS par `o2s-build-docs` depuis l'export WordPress `sources/aide_en_ligne.csv` (help_export.py :
#     dédoublonnage, intertitres, tableaux) — ne pas les éditer à la main, corriger l'export ou le script :
#       aide-<post_id>-<slug>.md           213 articles (procédures, présentations, FAQ, tutoriels…)
#       faq-prisme-<post_id>-<slug>.md     17 sections de la FAQ de migration Prisme → O2S
#       agregation-<partenaire>.md         149 fiches d'agrégation partenaire (faits extraits)
#       diagnostic-agregation-<slug>.md    7 fiches de diagnostic d'agrégation (hypothèses, actions, glossaire)
#     Leurs metadata viennent du frontmatter écrit par o2s-build-docs (titre, URL, produit, type quand il
#     est certain, liens, vidéos, faits partenaire, identifiants WordPress), complété par le profil
#     généré `config/document_profiles.yaml` (o2s-profile : résumé, type, thèmes, public, tâches,
#     questions, mots-clés, synonymes, prérequis) et les `patterns` ci-dessous.
#
# Priorité : defaults < patterns < faits extraits < profil généré < documents < frontmatter.
# Modifier une valeur change l'empreinte du document, qui est réindexé.
#
# Champs (cf. DocumentMetadata dans src/o2s_rag/domain/models.py et les vocabulaires de taxonomy.yaml) :
#   doc_id, title, corpus, doc_type, source_format (openapi | pdf | help_center | markdown), source_url,
#   api, api_name, version, resources, default_theme, secondary_themes, audience, audiences, products,
#   tags, description, summary, user_tasks, key_questions, keywords, synonyms, prerequisites,
#   partner, partner_facts, related_docs, exclude, doc_id_prefix (préfixe du doc_id généré).

defaults:
  language: fr
  audience: integrateur
  tags: [o2s, harvest]

# Metadata par famille de fichiers (regex sur le nom ; pour chaque champ, le 1er motif qui le fixe gagne).
patterns:
  - pattern: '^agregation-'
    doc_type: fiche_partenaire_agregation
    default_theme: agregation
    tags: [o2s, aide-en-ligne, agregation, partenaire]
  - pattern: '^diagnostic-agregation-'
    doc_type: depannage
    default_theme: agregation
    tags: [o2s, aide-en-ligne, agregation, diagnostic]
  - pattern: '^faq-prisme-'
    tags: [o2s, aide-en-ligne, prisme, migration]
  - pattern: '^(aide|agregation|diagnostic-agregation|faq-prisme)-'
    corpus: aide_en_ligne
    api: o2s_app
    source_format: markdown
    audience: conseiller
    tags: [o2s, aide-en-ligne]
  - pattern: '^Harvest API - '
    corpus: api_technique
    audience: integrateur
    audiences: [integrateur]
    products: [O2S]

documents:
  # ------------------------------------------------------------------ références OpenAPI
  "Harvest API - Comptes O2S.md":
    doc_id: ref-api-comptes-o2s
    title: "Harvest API - Comptes O2S (référence technique)"
    api: comptes
    api_name: "Harvest API - Comptes O2S"
    version: "0.9.3"
    doc_type: reference_api
    source_format: openapi
    resources: [Compte]
    default_theme: comptes
    related_docs: [guide-api-comptes-o2s, ref-o2s-api]
    tags: [comptes, situations, oauth2]
    description: >-
      Contrat de l'API de gestion des comptes O2S : lister / créer un compte (GET, POST /comptes),
      obtenir / mettre à jour un compte (GET, PUT /comptes/{compteId}), mettre à jour ses situations
      (PUT /comptes/{compteId}/situations), schémas Compte et OAuth, en-tête Content-Range.

  "Harvest API - Comptes.md":
    doc_id: ref-o2s-api
    title: "O2S API v1.89 - consultation (comptes, situations, agences, institutions, documents, utilisateurs)"
    api: o2s_api
    api_name: "O2S API"
    version: "1.89.2"
    doc_type: reference_api
    source_format: openapi
    language: fr-en
    resources: [Account, Account details, Agence, Institution, Document, Utilisateur]
    default_theme: comptes
    related_docs: [ref-api-comptes-o2s, ref-api-utilisateurs-o2s, ref-api-documents-o2s]
    tags: [accounts, account-details, situations, agences, institutions, lecture]
    description: >-
      API de récupération d'informations O2S (lecture seule, libellés majoritairement en anglais) :
      /accounts, /accounts/{accountId}/account-details (situations, liquidités, valorisation, prix moyen),
      /agences, /institutions, /documents, /utilisateurs.

  "Harvest API - Contacts O2S.md":
    doc_id: ref-api-contacts-o2s
    title: "Harvest API - Contacts O2S (référence technique)"
    api: contacts
    api_name: "Harvest API - Contacts O2S"
    version: "0.9.3"
    doc_type: reference_api
    source_format: openapi
    resources: [Contact, Relation]
    default_theme: contacts
    related_docs: [guide-api-contacts-relations-o2s, ref-api-referentiels-o2s]
    tags: [contacts, relations, personnes, faq]
    description: >-
      Contrat de l'API de gestion des contacts et relations O2S : /contacts, /contacts/{contactId},
      /relations, /relations/{relationId}, FAQ (données minimales de création, patrimoine/budget,
      profession, relations manuelles) et schémas (Contact, Personne, Relation, Stock, TypeFlux…).

  "Harvest API - Documents O2S.md":
    doc_id: ref-api-documents-o2s
    title: "Harvest API - Documents O2S (référence technique)"
    api: documents
    api_name: "Harvest API - Documents O2S"
    version: "0.9.3"
    doc_type: reference_api
    source_format: openapi
    resources: [Document, Catégorie]
    default_theme: documents
    related_docs: [guide-api-documents-categories-o2s]
    tags: [documents, ged, categories]
    description: >-
      Contrat de l'API de gestion des documents O2S (GED) : /documents, /documents/{documentId},
      /categories-documents, schémas Document et catégories.

  "Harvest API - Référentiels  O2S.md":
    doc_id: ref-api-referentiels-o2s
    title: "Harvest API - Référentiels O2S (référence technique)"
    api: referentiels
    api_name: "Harvest API - Référentiels O2S"
    version: "0.9.3"
    doc_type: reference_api
    source_format: openapi
    resources: [ElementTableReferentiel]
    default_theme: referentiels
    related_docs: [ref-api-contacts-o2s]
    tags: [referentiels, professions, capacites, origines, qualites, environnements]
    description: >-
      API de lecture des référentiels O2S : /referentiels/contact-professions, contact-capacites,
      contact-origines, contact-qualites ; URL d'authentification recette et production.

  "Harvest API - Utilisateurs O2S.md":
    doc_id: ref-api-utilisateurs-o2s
    title: "Harvest API - Utilisateurs O2S (référence technique)"
    api: utilisateurs
    api_name: "Harvest API - Utilisateurs O2S"
    version: "0.9.0"
    doc_type: reference_api
    source_format: openapi
    resources: [Utilisateur, Agence, Profil]
    default_theme: utilisateurs
    related_docs: [ref-o2s-api]
    tags: [utilisateurs, agences, profils, administration]
    description: >-
      Contrat de l'API de gestion des utilisateurs O2S : /utilisateurs, /utilisateurs/{utilisateurId},
      statut, responsable, /agences, /agences/{agenceId}, /profils.

  # ------------------------------------------------------------------ guides fonctionnels (PDF)
  "Harvest API - O2S-DocumentationAPIO2SComptes.md":
    doc_id: guide-api-comptes-o2s
    title: "Documentation API O2S - Comptes (guide fonctionnel)"
    api: comptes
    api_name: "Harvest API - Comptes O2S"
    doc_type: guide_fonctionnel
    source_format: pdf
    resources: [Compte]
    default_theme: comptes
    related_docs: [ref-api-comptes-o2s]
    tags: [comptes, comptes-especes, tableau-de-synthese, placement, detenteurs]
    description: >-
      Spécificités O2S de l'API Comptes (comptes espèces uniquement) : tableau de synthèse des champs
      (PP/PM, GET/POST/PUT), placement, valeur, détenteurs, clôture via statut « CLOS ».

  "Harvest API - O2S-DocumentationAPIO2SContactsRelations.md":
    doc_id: guide-api-contacts-relations-o2s
    title: "Documentation API O2S - Contacts & Relations (guide fonctionnel)"
    api: contacts
    api_name: "Harvest API - Contacts O2S"
    doc_type: guide_fonctionnel
    source_format: pdf
    resources: [Contact, Relation]
    default_theme: contacts
    related_docs: [ref-api-contacts-o2s, ref-api-referentiels-o2s]
    tags: [contacts, relations, tableau-de-synthese, ihm, patrimoine, budget, adresses, profil-investisseur]
    description: >-
      Spécificités O2S des API Contacts et Relations : tableau de synthèse et positions dans l'IHM O2S,
      adresses, critères de placement, suppression de données, capacité juridique, codes patrimoine
      et budget, types & rôles de relations, relations « AFFAIRES » et relations manuelles.

  "Harvest API - O2S-DocumentationAPIO2SDocumentsCategories.md":
    doc_id: guide-api-documents-categories-o2s
    title: "Documentation API O2S - Documents & Catégories (guide fonctionnel)"
    api: documents
    api_name: "Harvest API - Documents O2S"
    doc_type: guide_fonctionnel
    source_format: pdf
    resources: [Document, Catégorie]
    default_theme: documents
    related_docs: [ref-api-documents-o2s]
    tags: [documents, ged, categories, metadonnees, piece-identite]
    description: >-
      Spécificités O2S des API Documents et Catégories : tableau de synthèse, métadonnées à fournir
      pour les types « AUTRE » (catégorie GED) et « IDENTITE » (pièce d'identité), exemples JSON.


chapters:
  - {pattern: '^API\s+Contacts\b', resource: contacts}
  - {pattern: '^API\s+Relations\b', resource: relations}
  - {pattern: '^API\s+Documents\b', resource: documents}
  - {pattern: '^API\s+Cat[ée]gories\b', resource: categories_documents}
  - {pattern: '^API\s+Comptes\b', resource: comptes}

# Ressource / thème d'un endpoint d'après son chemin (références OpenAPI).
path_resources:
  - {pattern: '^/auth/', resource: authentification}
  - {pattern: '^/contacts', resource: contacts}
  - {pattern: '^/relations', resource: relations}
  - {pattern: '^/categories-documents', resource: categories_documents}
  - {pattern: '^/documents', resource: documents}
  - {pattern: '^/comptes', resource: comptes}
  - {pattern: '^/accounts', resource: comptes}
  - {pattern: '^/referentiels', resource: referentiels}
  - {pattern: '^/(utilisateurs|agences|profils)', resource: utilisateurs}
  - {pattern: '^/institutions', resource: institutions}

# --------------------------------------------------------------------------------------------
# Règles de sections : appliquées au fil d'Ariane (« Titre H1 > H2 > H3 ») de chaque nœud.
# Les règles sont lues dans l'ordre ; pour chaque champ, la première règle qui le fixe gagne.
#   intent / theme / content_type    valeur IMPOSÉE (le LLM ne peut pas la changer)
#   intent_hint / content_type_hint  suggestion transmise au LLM d'enrichissement
#   section_kind                     nature de la section (filtrable)
#   shared: true                     section commune à toutes les API (dédoublonnée à la recherche)
# --------------------------------------------------------------------------------------------
section_rules:
  # --- blocs communs à toutes les références OpenAPI
  - pattern: 'R[èe]glement G[ée]n[ée]ral sur la Protection|RGPD'
    corpus: api_technique
    intent: securite_conformite
    theme: rgpd
    content_type: juridique
    section_kind: rgpd
    shared: true
  - pattern: 'openid-connect/token'
    corpus: api_technique
    intent: authentification
    theme: authentification
    section_kind: endpoint_authentification
    shared: true
  - pattern: '(^|> )(S[ée]curit[ée]|Authent|Authentification)( >|$)|Sch[ée]mas? de s[ée]curit[ée]'
    corpus: api_technique
    intent: authentification
    theme: authentification
    section_kind: authentification
    shared: true
  - pattern: 'Sch[ée]ma : OAuth'
    corpus: api_technique
    intent: authentification
    theme: authentification
    content_type: schema
    section_kind: schema
    shared: true
  - pattern: 'R[ée]ponse en cas de probl[èe]me|(^|> )Problem( >|$)'
    corpus: api_technique
    intent: codes_erreur
    theme: erreurs
    content_type: erreur
    section_kind: erreurs_generiques
    shared: true
  - pattern: '(^|> )(Informations G[ée]n[ée]rales|Logo|Serveurs|Groupes de tags|Tags|Titre|Version)( >|$)'
    corpus: api_technique
    intent: concepts_generaux
    theme: general
    content_type_hint: description
    section_kind: informations_generales
    shared: false
  # --- FAQ (référence Contacts)
  - pattern: '(^|> )FAQ'
    corpus: api_technique
    content_type: faq
    section_kind: faq
    intent_hint: regles_metier
  # --- références : endpoints et composants
  - pattern: '(^|> )(GET|POST|PUT|PATCH|DELETE) /'
    corpus: api_technique
    content_type_hint: endpoint
    intent_hint: reference_endpoint
    section_kind: endpoint
  - pattern: '(^|> )(Sch[ée]ma|Param[èe]tre|En-t[êe]te) :'
    corpus: api_technique
    content_type: schema
    intent_hint: format_reponse
    section_kind: schema
  - pattern: '(^|> )(Composants|Sch[ée]mas)( >|$)'
    corpus: api_technique
    content_type_hint: schema
    intent_hint: format_reponse
    section_kind: schema
  # --- guides fonctionnels
  - pattern: '(^|> )(fluxs?|stocks?|Indicateurs|Dispositions|Assurances Emprunteur)(/|$| >)|Sch[ée]ma : (Stock|TypeFlux|Dispositions)'
    corpus: api_technique
    theme_hint: patrimoine_budget
  - pattern: 'L[ée]gende'
    corpus: api_technique
    intent: concepts_generaux
    content_type: glossaire
    section_kind: legende
  - pattern: 'Tableau de synth[èe]se'
    corpus: api_technique
    content_type_hint: tableau_synthese
    intent_hint: disponibilite_champs
    section_kind: tableau_synthese
  - pattern: 'types? (&|et) r[ôo]les'
    corpus: api_technique
    intent_hint: valeurs_autorisees
    content_type_hint: tableau_valeurs
    theme: relations
    section_kind: valeurs
  - pattern: 'relations? manuelles?|relations? « ?AFFAIRES'
    corpus: api_technique
    intent_hint: regles_metier
    theme: relations
    section_kind: regle_metier
  - pattern: 'M[ée]thode de suppression'
    corpus: api_technique
    intent: regles_metier
    content_type_hint: procedure
    section_kind: regle_metier
  - pattern: 'Capacit[ée] juridique'
    corpus: api_technique
    intent_hint: valeurs_autorisees
    content_type_hint: tableau_valeurs
    theme: contacts
    section_kind: valeurs
  - pattern: 'Patrimoine et Budget'
    corpus: api_technique
    intent_hint: valeurs_autorisees
    content_type_hint: tableau_valeurs
    theme: patrimoine_budget
    section_kind: valeurs
  - pattern: 'crit[èe]res de placement'
    corpus: api_technique
    intent_hint: valeurs_autorisees
    theme: contacts
    section_kind: valeurs
  - pattern: 'Les adresses'
    corpus: api_technique
    intent_hint: regles_metier
    theme: contacts
    section_kind: regle_metier
  - pattern: 'Type « ?(AUTRE|IDENTIT)'
    corpus: api_technique
    intent_hint: regles_metier
    theme: documents
    section_kind: regle_metier
  - pattern: '(^|> )(\d+/ )?G[ée]n[ée]ralit[ée]s'
    corpus: api_technique
    intent_hint: concepts_generaux
    section_kind: generalites
  - pattern: '(^|> )Introduction'
    corpus: api_technique
    intent: concepts_generaux
    content_type: description
    section_kind: introduction
  - pattern: '(^|> )Exemple'
    corpus: api_technique
    content_type_hint: exemple
    intent_hint: exemple_integration

  # =========================================================================== aide en ligne
  # Intertitres reconstruits par help_center.py (questions de FAQ, sections du sommaire).
  - pattern: '(^|> )(Pourquoi|Que faire|Quels? sont les causes)\b[^>]*\?$'
    corpus: aide_en_ligne
    intent_hint: depannage
    content_type_hint: faq
    section_kind: question
  - pattern: '(^|> )(Comment|Où|Peut-on|Puis-je|Est-il possible)\b[^>]*\?$'
    corpus: aide_en_ligne
    intent_hint: procedure_utilisateur
    content_type_hint: faq
    section_kind: question
  - pattern: '(^|> )[^>]*\?$'
    corpus: aide_en_ligne
    content_type_hint: faq
    section_kind: question
  - pattern: '(^|> )(Pr[ée]-?requis|Configuration requise|Navigateurs? compatibles?)'
    corpus: aide_en_ligne
    intent_hint: configuration_environnement
    section_kind: prerequis
  - pattern: '(^|> )(Mise en place|Param[ée]trage|Param[ée]trer|Configuration|Configurer|Activer|Activation|Droits?|Habilitations?|Gestion des profils)'
    corpus: aide_en_ligne
    intent_hint: parametrage_configuration
    content_type_hint: procedure
    section_kind: parametrage
  - pattern: '(^|> )(Pr[ée]sentation|Introduction|[ÀA] savoir|Avant de commencer|Qu.est-ce)'
    corpus: aide_en_ligne
    intent_hint: presentation_fonctionnalite
    content_type_hint: presentation
    section_kind: presentation
  - pattern: '(^|> )(Nouveaut[ée]s|Historique des nouveaut[ée]s|Palmar[èe]s)'
    corpus: aide_en_ligne
    intent_hint: actualite_nouveaute
    section_kind: actualite
  - pattern: '(^|> )(Tutos?|Tutoriels?|Vid[ée]os?)\b'
    corpus: aide_en_ligne
    content_type_hint: tutoriel_video
    section_kind: tutoriel

# Indications par type de document (appliquées après les règles de sections ; mêmes conventions).
doc_type_hints:
  fiche_partenaire_agregation: {intent: information_partenaire, content_type: fiche_partenaire, theme: agregation, section_kind: fiche_partenaire}
  fiche_partenaire_integration: {intent_hint: information_partenaire, content_type_hint: fiche_partenaire}
  faq: {intent_hint: faq, content_type_hint: faq}
  depannage: {intent_hint: depannage, content_type_hint: procedure}
  guide_utilisateur: {intent_hint: procedure_utilisateur, content_type_hint: procedure}
  presentation_fonctionnalite: {intent_hint: presentation_fonctionnalite, content_type_hint: presentation}
  parametrage: {intent_hint: parametrage_configuration, content_type_hint: procedure}
  tutoriel_video: {intent_hint: procedure_utilisateur, content_type_hint: tutoriel_video}
  reference_liste: {content_type_hint: tableau_valeurs}
  migration: {theme_hint: migration_prisme}
  actualite: {intent_hint: actualite_nouveaute}
  formation: {intent_hint: presentation_fonctionnalite, content_type_hint: presentation}
