# Produits et modules : alias reconnus dans le texte -> forme canonique (metadata `products`,
# expansion du texte BM25). Les alias sont des expressions exactes (insensibles à la casse).
products:
  O2S: ["O2S"]
  MoneyPitch: ["MoneyPitch", "Money Pitch", "portail patrimonial"]
  Prisme: ["Prisme"]
  Big: ["Big Expert", "Big"]
  Quantalys: ["Quantalys"]
  Business Link: ["Business Link", "O2S Business Link"]
  Wealth Link: ["Wealth Link"]
  Wealth Platform: ["Wealth Platform", "Wealth Digital"]
  Assistant IA O2S: ["Assistant IA", "assistant IA O2S"]
  Assistant Aide O2S: ["Assistant Aide", "assistant d'aide"]
  Microsoft Outlook: ["Outlook", "Microsoft 365", "Office 365"]
  Microsoft Entra ID: ["Entra ID", "Microsoft Entra", "Azure AD"]
  Google Workspace: ["Google Agenda", "Google Calendar", "Gmail", "Google Workspace"]
  Universign: ["Universign"]
  Microsoft Excel: ["Excel"]
  Microsoft Word: ["Word"]

# Glossaire métier : sigle -> formes développées / synonymes. Sert à l'expansion du texte BM25
# (un chunk qui contient « SRI » est aussi retrouvé par « indicateur de risque ») et au LLM.
glossary:
  KYC: ["connaissance client", "know your customer", "dossier de connaissance client"]
  SRI: ["indicateur synthétique de risque", "indicateur de risque", "niveau de risque"]
  SRRI: ["indicateur de risque et de rendement", "indicateur de risque"]
  DDA: ["directive distribution d'assurances"]
  DCC: ["document de connaissance client", "déclaration de conformité client"]
  RIC: ["recueil d'informations client"]
  MIF2: ["MiFID II", "directive marchés d'instruments financiers"]
  MIF: ["MiFID", "directive marchés d'instruments financiers"]
  LAB-FT: ["LCB-FT", "lutte anti-blanchiment", "lutte contre le blanchiment et le financement du terrorisme"]
  PPE: ["personne politiquement exposée"]
  GED: ["gestion électronique des documents", "documents du client"]
  SSO: ["authentification unique", "single sign-on", "connexion unique"]
  SCPI: ["société civile de placement immobilier"]
  OPCVM: ["fonds", "organisme de placement collectif"]
  UC: ["unité de compte", "unités de compte"]
  PER: ["plan d'épargne retraite"]
  PEA: ["plan d'épargne en actions"]
  FCPI: ["fonds commun de placement dans l'innovation"]
  FIP: ["fonds d'investissement de proximité"]
  ESG: ["critères environnementaux sociaux et de gouvernance", "finance durable"]
  VL: ["valeur liquidative"]
  PAM: ["prix d'achat moyen", "PRU", "prix de revient unitaire"]
  IMAP: ["courrier entrant", "messagerie entrante"]
  SMTP: ["courrier sortant", "serveur d'envoi"]
  code apporteur: ["code courtier", "identifiant apporteur", "code intermédiaire"]
  agrégation: ["synchronisation des contrats", "remontée des données partenaires", "flux partenaires"]
  lettre d'autorisation: ["mandat d'agrégation", "autorisation partenaire"]
  déclaration d'adéquation: ["rapport d'adéquation", "lettre d'adéquation", "conseil en investissement"]
  profil investisseur: ["profil d'investisseur", "questionnaire profil", "profil de risque"]
