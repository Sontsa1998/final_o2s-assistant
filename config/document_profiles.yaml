  summary: 'Ce document explique, à partir d''un exemple chiffré sur un compte avec versements et arbitrage, la
    différence entre trois notions souvent confondues : la plus-value (gain par support depuis le dernier mouvement),
    le gain brut (progression des sommes versées en euros ou en %) et la performance cumulée (rendement des supports
    indépendamment des entrées/sorties). Il montre que ces trois indicateurs coïncident en l''absence de mouvement,
    mais divergent dès qu''il y a des versements complémentaires ou des arbitrages. Destiné aux conseillers utilisateurs
    d''O2S pour mieux interpréter les résultats affichés sur les comptes clients.'
  user_tasks:
  - Interpréter la plus-value affichée sur un compte
  - Interpréter le gain brut affiché sur un compte
