[project]
name = "o2s-agentic-rag"
version = "4.0.0"
description = "Assistant O2S V4 — Agentic RAG (LangGraph + Qdrant + LiteLLM) en architecture hexagonale"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Christian Sontsa" }]

# Socle commun minimal : chaque service n'installe que son extra (images Docker légères).
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "openai>=1.54",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
indexer = ["qdrant-client>=1.12", "fastembed>=0.4", "tiktoken>=0.8"]
search = ["qdrant-client>=1.12", "fastembed>=0.4"]
reranker = []
reranker-cross-encoder = ["sentence-transformers>=3.0"]
agent = [
    "langgraph>=0.3",
    "langgraph-checkpoint-sqlite>=2.0",
    "aiosqlite>=0.20",
]
postgres = ["langgraph-checkpoint-postgres>=2.0", "psycopg[binary,pool]>=3.2"]
mcp = ["langchain-mcp-adapters>=0.1"]
# Tout-en-un pour le développement local (agent + recherche + indexation in-process)
local = [
    "o2s-agentic-rag[indexer,search,agent]",
]
eval = ["o2s-agentic-rag[local]"]
dev = ["o2s-agentic-rag[local]", "pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
o2s-index = "o2s_rag.adapters.inbound.cli.index_cli:main"
o2s-chat = "o2s_rag.adapters.inbound.cli.chat_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/o2s_rag"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
